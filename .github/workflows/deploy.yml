name: Deploy Static Site

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v2

    - name: Build Docker Image
      run: docker build -t weather-app .

    - name: Deploy to Render
      run: |
        echo "$RENDER_API_KEY" | docker login --username "$RENDER_USERNAME" --password-stdin
        docker tag weather-app render-weather-app
        docker push render-weather-app